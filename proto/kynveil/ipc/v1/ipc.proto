syntax = "proto3";

package kynveil.ipc.v1;

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes session_id = 3;
  uint64 request_id = 4;

  oneof body {
    HelloRequest hello_request = 10;
    HelloResponse hello_response = 11;
    GetStatusRequest get_status_request = 12;
    GetStatusResponse get_status_response = 13;
    ShutdownRequest shutdown_request = 14;
    ShutdownResponse shutdown_response = 15;
    ErrorResponse error_response = 16;
    GetProfileStatusRequest get_profile_status_request = 17;
    GetProfileStatusResponse get_profile_status_response = 18;
    LockProfileRequest lock_profile_request = 19;
    LockProfileResponse lock_profile_response = 20;
    UnlockProfileRequest unlock_profile_request = 21;
    UnlockProfileResponse unlock_profile_response = 22;
  }
}

message HelloRequest {
  string client_build = 1;
}

message HelloResponse {
  string core_build = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  CoreState state = 1;
}

enum CoreState {
  CORE_STATE_UNSPECIFIED = 0;
  CORE_STATE_READY = 1;
  CORE_STATE_LOCKED = 2;
}

message GetProfileStatusRequest {}
message GetProfileStatusResponse { ProfileState state = 1; }
message LockProfileRequest {}
message LockProfileResponse { ProfileState state = 1; }
message UnlockProfileRequest {}
message UnlockProfileResponse { ProfileState state = 1; }

enum ProfileState {
  PROFILE_STATE_UNSPECIFIED = 0;
  PROFILE_STATE_UNLOCKED = 1;
  PROFILE_STATE_LOCKED = 2;
  PROFILE_STATE_KEYSTORE_UNAVAILABLE = 3;
  PROFILE_STATE_CORRUPT = 4;
  PROFILE_STATE_ERROR = 5;
}

message ShutdownRequest {}

message ShutdownResponse {}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_STALE_SESSION = 3;
  ERROR_CODE_DUPLICATE_REQUEST = 4;
  ERROR_CODE_BUSY = 5;
  ERROR_CODE_INTERNAL = 6;
}
