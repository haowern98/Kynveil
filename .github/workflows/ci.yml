name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.7.0
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: corepack pnpm install --frozen-lockfile
      - name: Configure Electron sandbox
        run: |
          electron_path="$(corepack pnpm --filter @kynveil/desktop exec node -e 'console.log = () => {}; process.stdout.write(require("electron"))')"
          sandbox_path="$(dirname "$electron_path")/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%u:%g:%a' "$sandbox_path")" = "0:0:4755"
      - run: xvfb-run -a corepack pnpm verify

  storage:
    name: storage (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2025
            architecture: x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.7.0
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify runner architecture
        if: runner.os != 'Windows'
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Verify Windows runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not [Environment]::Is64BitOperatingSystem) { exit 1 }
      - name: Run Stage 3 storage regressions through controlled native build
        run: node scripts/cargo-with-sqlcipher.mjs test --package kynveil-core storage::tests
      - name: Verify controlled native artifact target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e "const artifact = require('./target/kynveil-native/sqlcipher/4.18.0/artifact.json'); if (artifact.target !== process.env.EXPECTED_TARGET || !artifact.libDirectory.startsWith(process.cwd())) process.exit(1)"
      - name: Reject unexpected runtime crypto or SQLite libraries
        if: runner.os != 'Windows'
        run: |
          binary="$(find target/debug/deps -maxdepth 1 -type f -name 'kynveil_core-*' -perm -111 -print -quit)"
          test -n "$binary"
          if [ "${{ runner.os }}" = Linux ]; then
            dependencies="$(ldd "$binary")"
          else
            dependencies="$(otool -L "$binary")"
          fi
          printf '%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -Eiq 'lib(crypto|ssl|sqlcipher|sqlite3)(\.so|\.dylib|\.dll)'; then
            exit 1
          fi
